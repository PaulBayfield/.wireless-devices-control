[project]
name = "wireless-devices-control"
version = "0.1.0"
description = "Control wireless devices and watch their batteries: Bose over BMAP, Logitech over HID++."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
keywords = ["bose", "logitech", "bluetooth", "rfcomm", "bmap", "hidpp", "battery"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

# Bose is standard library only; Logitech needs hidapi for the receiver.
dependencies = [
    "hidapi>=0.15.0",
    "python-dotenv>=1.2.2",
    "sanic>=25.12.0",
    "sanic-ext",
]

[tool.uv]
# Run from the source tree rather than installed: `uv run __main__.py`. uv
# still creates the environment and resolves the groups below, it just does
# not build a wheel out of src/.
package = false

[tool.uv.sources]
sanic-ext = { git = "https://github.com/PaulBayfield/sanic-ext" }

[dependency-groups]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# UP031/UP032: the Bose code uses %-formatting throughout, deliberately -- it
# reads better for the fixed-width tables it prints.
ignore = ["UP031", "UP032", "E501"]

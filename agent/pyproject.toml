[project]
name = "devices-agent"
version = "0.1.0"
description = "The Devices agent: polls wireless devices (Bose over BMAP, Logitech over HID++), keeps their battery history and sends it to devices.bayfield.dev."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
keywords = ["bose", "logitech", "bluetooth", "rfcomm", "bmap", "hidpp", "battery"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

# Bose is standard library only; Logitech needs hidapi for the receiver.
# The desktop app talks to the agent on stdin/stdout: no web framework.
dependencies = [
    "hidapi>=0.15.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
# Run from the source tree rather than installed: `uv run __main__.py`. uv
# still creates the environment and resolves the groups below, it just does
# not build a wheel out of src/.
package = false

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# UP031/UP032: the Bose code uses %-formatting throughout, deliberately -- it
# reads better for the fixed-width tables it prints.
ignore = ["UP031", "UP032", "E501"]

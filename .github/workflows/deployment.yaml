name: Production Deployment

# The server image (web app + API). The agent is not deployed: it runs natively on each computer
# the devices are connected to (Bluetooth radio, USB receiver).

on:
  push:
    branches:
      - main
    paths-ignore:
      - "agent/**"
      - "src-tauri/**"
      - "**.md"

env:
  REGISTRY: ghcr.io
  # Set explicitly: the image keeps this name whatever the repository is called.
  IMAGE_NAME: paulbayfield/devices.bayfield.dev

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the release
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.get_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Settings → About compares the running version with the latest release, so publish one
      # whenever package.json's version changes (once its image is pushed).
      - name: Publish a GitHub release for a new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.get_version.outputs.version }}
        run: |
          # release.yml (desktop installers) may have created it first: either one is fine.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes || gh release view "$TAG" > /dev/null
          fi

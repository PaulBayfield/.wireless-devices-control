version: 2
updates:
  # Web app (and the desktop app's JavaScript side)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Server
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"

  # Agent
  - package-ecosystem: "uv"
    directory: "/agent"
    schedule:
      interval: "weekly"

  # Desktop app (Rust side)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

services:
  devices:
    image: ghcr.io/paulbayfield/devices.bayfield.dev:latest
    build: .
    env_file: server/.env
    ports:
      - "8830:8830"
    # The SQLite database (devices.db): back it up by copying the folder.
    volumes:
      - devices-data:/data
    restart: unless-stopped

volumes:
  devices-data:

[project]
name = "bose-control"
version = "1.0.0"
description = "Dependency-free control of Bose hardware over BMAP, the protocol the Bose app speaks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["bose", "bluetooth", "rfcomm", "bmap", "quietcomfort", "soundlink"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]

# Nothing here, and nothing planned: the whole client is standard library.
dependencies = []

[tool.uv]
# Run from the source tree rather than installed: `uv run main.py`. uv still
# creates the environment and resolves the groups below, it just does not
# build a wheel out of src/.
package = false

[dependency-groups]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# UP031/UP032: the codebase uses %-formatting throughout, deliberately -- it
# reads better for the fixed-width tables this prints and runs on 3.9.
ignore = ["UP031", "UP032", "E501"]

[package]
name = "devices"
version = "0.3.4"
description = "Batteries and settings of wireless devices, from every computer"
authors = ["bayfield"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "devices_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
